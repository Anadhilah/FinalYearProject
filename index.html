<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/4iRN0X78iZVJcBDNsOKp9JdI0vj1/social-images/social-1773855445152-ChatGPT_Image_Mar_9,_2026,_10_19_04_PM.webp">
    <meta property="og:title" content="InternshipConnect - Find Your Dream Internship">
  <meta name="twitter:title" content="InternshipConnect - Find Your Dream Internship">
  <meta property="og:description" content="InternshipConnect bridges ambitious students and top companies. Discover internships, apply with ease, and launch your career.">
  <meta name="twitter:description" content="InternshipConnect bridges ambitious students and top companies. Discover internships, apply with ease, and launch your career.">
</head>

  <body>
    <div id="root"></div>
    <!-- Splash Screen -->
    <div id="splash-screen" class="splash-screen">
      <div class="splash-content">
        <img src="/logo.png" alt="InternshipConnect" class="splash-logo" />
        <p class="splash-tagline">Connecting Opportunities...</p>
        <div class="spinner"></div>
      </div>
    </div>
    <style>
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.5s ease-out 0.5s;
      }
      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash-content {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
      }
      .splash-logo {
        width: 120px;
        height: 120px;
        object-fit: contain;
        animation: float 3s ease-in-out infinite;
      }
      .splash-tagline {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        font-size: 1.1rem;
        color: #1e40af;
        margin: 0;
        font-weight: 500;
        letter-spacing: 0.05em;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #1e40af;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide splash screen when app loads
      window.addEventListener('load', () => {
        const splashScreen = document.getElementById('splash-screen');
        if (splashScreen) {
          setTimeout(() => {
            splashScreen.classList.add('hidden');
          }, 1000);
        }
      });
      // Also hide after 3 seconds as a fallback
      setTimeout(() => {
        const splashScreen = document.getElementById('splash-screen');
        if (splashScreen && !splashScreen.classList.contains('hidden')) {
          splashScreen.classList.add('hidden');
        }
      }, 3000);
    </script>
  </body>
</html>
