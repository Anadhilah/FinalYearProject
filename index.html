  <meta name="twitter:title" content="InternshipConnect - Find Your Dream Internship">
  <meta property="og:description" content="InternshipConnect bridges ambitious students and top companies. Discover internships, apply with ease, and launch your career.">
  <meta name="twitter:description" content="InternshipConnect bridges ambitious students and top companies. Discover internships, apply with ease, and launch your career.">
</head>

  <body>
    <div id="root"></div>
    <!-- Splash Screen (mobile app / standalone PWA only) -->
    <div id="splash-screen" class="splash-screen">
      <div class="splash-content">
        <div class="splash-panel">
          <div class="splash-logo-wrap">
            <img src="/logo.png" alt="InternshipConnect" class="splash-logo" />
          </div>
          <div class="splash-brand">InternshipConnect</div>
        </div>
        <div class="spinner"></div>
      </div>
    </div>
    <style>
      /* Hidden by default. Revealed only in standalone (installed PWA) mode via JS. */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at top, rgba(96, 165, 250, 0.35), transparent 30%),
          linear-gradient(135deg, #eff6ff 0%, #dbeafe 30%, #e2e8f0 100%);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.45s ease-out 0.25s;
      }
      #splash-screen.visible {
        display: flex;
      }
      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
      }
      .splash-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: min(78vw, 220px);
        padding: 1.2rem 1rem 1rem;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(148, 163, 184, 0.3);
        border-radius: 28px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12), 0 8px 18px rgba(30, 64, 175, 0.08);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .splash-logo-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 96px;
        height: 96px;
        border-radius: 24px;
        background: linear-gradient(135deg, #dbeafe, #eff6ff);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.9);
      }
      .splash-logo {
        width: 72px;
        height: 72px;
        object-fit: contain;
      }
      .splash-brand {
        margin-top: 0.8rem;
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(15, 23, 42, 0.8);
      }
      .spinner {
        position: relative;
        z-index: 2;
        width: 42px;
        height: 42px;
        border: 4px solid rgba(59, 130, 246, 0.18);
        border-top-color: #1d4ed8;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.35);
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Only show the splash screen in the installed PWA / mobile app
      // (display-mode: standalone). Regular web browsers never see it.
      (function () {
        var standalone =
          window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: fullscreen)').matches ||
          window.navigator.standalone === true;

        var splash = document.getElementById('splash-screen');

        function hideSplash() {
          if (!splash) return;
          splash.classList.add('hidden');
          setTimeout(function () {
            splash.classList.remove('visible');
          }, 600);
        }

        if (!standalone) {
          // Web: never show the splash at all.
          return;
        }

        splash.classList.add('visible');

        window.addEventListener('load', function () {
          setTimeout(hideSplash, 1200);
        });

        // Fallback so the splash never blocks the app.
        setTimeout(hideSplash, 4000);
      })();
    </script>
  </body>
</html>
