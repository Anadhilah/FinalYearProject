  <meta property="og:description" content="InternshipConnect bridges ambitious students and top companies. Discover internships, apply with ease, and launch your career.">
  <meta name="twitter:description" content="InternshipConnect bridges ambitious students and top companies. Discover internships, apply with ease, and launch your career.">
</head>

  <body>
    <div id="root"></div>
    <!-- Splash Screen (mobile app / standalone PWA only) -->
    <div id="splash-screen" class="splash-screen">
      <div class="splash-content">
        <img src="/logo.png" alt="InternshipConnect" class="splash-logo" />
        <div class="splash-overlay"></div>
        <div class="spinner"></div>
      </div>
    </div>
    <style>
      /* Hidden by default. Revealed only in standalone (installed PWA) mode via JS. */
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #1e40af;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.5s ease-out 0.5s;
      }
      #splash-screen.visible {
        display: flex;
      }
      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      /* Full-screen logo — covers the entire screen */
      .splash-content {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .splash-logo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* Overlay gradient so the spinner and logo stay legible */
      .splash-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(30, 64, 175, 0.25) 0%, rgba(30, 64, 175, 0) 50%, rgba(30, 64, 175, 0.45) 100%);
      }
      .spinner {
        position: relative;
        z-index: 2;
        width: 48px;
        height: 48px;
        border: 5px solid rgba(255, 255, 255, 0.9);
        border-top-color: #1e40af;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        box-shadow: 0 0 14px rgba(255, 255, 255, 0.5);
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Only show the splash screen in the installed PWA / mobile app
      // (display-mode: standalone). Regular web browsers never see it.
      (function () {
        var standalone =
          window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: fullscreen)').matches ||
          window.navigator.standalone === true;

        var splash = document.getElementById('splash-screen');

        function hideSplash() {
          if (!splash) return;
          splash.classList.add('hidden');
          setTimeout(function () {
            splash.classList.remove('visible');
          }, 600);
        }

        if (!standalone) {
          // Web: never show the splash at all.
          return;
        }

        splash.classList.add('visible');

        window.addEventListener('load', function () {
          setTimeout(hideSplash, 1200);
        });

        // Fallback so the splash never blocks the app.
        setTimeout(hideSplash, 4000);
      })();
    </script>
  </body>
</html>
