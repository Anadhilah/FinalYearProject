# Netlify build configuration
# The git repo (Anadhilah/FinalYearProject) root is this folder (internship-connect-ui),
# so package.json is at the repo root. Do NOT set base to a nested internship-connect-ui path.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirect email confirmation callbacks to index.html so React Router can handle them
[[redirects]]
  from = "/auth/*"
  to = "/index.html"
  status = 200

# Catch-all redirect for SPA - handles all routes that don't match static files
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
